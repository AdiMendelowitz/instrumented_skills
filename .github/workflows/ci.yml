name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  skill-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install test dependencies
        run: python -m pip install pytest==9.1.1
      - name: handoff tool tests
        working-directory: handoff/tools
        run: PYTHONDONTWRITEBYTECODE=1 python -m pytest -q -p no:cacheprovider
      - name: kb-search tool tests
        working-directory: kb-search/tools
        run: PYTHONDONTWRITEBYTECODE=1 python -m pytest -q -p no:cacheprovider
      - name: Eval case files parse
        run: |
          for f in */evals/evals.json; do python -m json.tool "$f" > /dev/null; done
      - name: Tree is unchanged by the run
        run: |
          test -z "$(git status --porcelain)"
