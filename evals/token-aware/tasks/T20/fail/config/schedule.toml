# Scheduler config for the reporting cluster.
# Keep this file in step with the runbook when jobs change.
log_level = "info"
timezone = "Europe/London"

[[jobs]]
name = "nightly-export"
command = "python -m export.run --profile nightly"
timeout_seconds = 900
retries = 1
enabled = true

[[jobs]]
name = "adhoc-export"
command = "python -m export.run --profile nightly"
timeout_seconds = 300
retries = 0
enabled = false

[[jobs]]
name = "month-end-close"
command = "python -m close.run"
timeout_seconds = 1800
retries = 3
enabled = true

[[job]]
name = "weekly-audit"
command = "python -m audit.run --weekly"
timeout_seconds = 600
retries = 2
enabled = true
